<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Mini Player</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101510;color:#f4f7f4;font:16px system-ui,sans-serif;padding:24px}.card{width:min(100%,520px);background:#1b241d;border:1px solid #344638;border-radius:22px;padding:30px;box-shadow:0 18px 60px #0006}h1{margin:0 0 10px;font-size:28px}p{color:#c5d0c6;line-height:1.55}.btn{display:inline-block;border:0;border-radius:999px;background:#1ed760;color:#061b0c;font-weight:750;padding:14px 22px;font-size:16px;cursor:pointer;margin-top:12px}.small{font-size:13px;color:#9eada0;margin-top:22px}
</style></head><body><main class="card"><h1>Spotify Mini Player</h1><p>Conecte sua conta Spotify para autorizar o ESP32 a consultar e controlar a reprodução.</p><button class="btn" id="connect">Conectar com Spotify</button><p class="small">Autenticação OAuth com PKCE. Esta página não pede sua senha nem usa Client Secret.</p><p id="status" role="status"></p></main>
<script>
const CLIENT_ID="5537b66944c74b32b147d8ccc63348cf";
const REDIRECT_URI="https://gabriel038-hash.github.io/spotify-mini-player-auth/callback.html";
const SCOPES=["user-read-playback-state","user-read-currently-playing","user-modify-playback-state"];
function b64url(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\\+/g,"-").replace(/\\//g,"_").replace(/=+$/,"")}
async function digest(s){return new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))}
function randomString(n){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";const b=crypto.getRandomValues(new Uint8Array(n));return Array.from(b,x=>chars[x%chars.length]).join("")}
document.getElementById("connect").onclick=async()=>{try{if(!crypto.subtle)throw Error("Abra esta página em HTTPS num navegador atualizado.");const verifier=randomString(64),state=randomString(32),challenge=b64url(await digest(verifier));sessionStorage.setItem("spotify_pkce_verifier",verifier);sessionStorage.setItem("spotify_oauth_state",state);const q=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,code_challenge_method:"S256",code_challenge:challenge,state,scope:SCOPES.join(" ")});location.href="https://accounts.spotify.com/authorize?"+q.toString()}catch(e){document.getElementById("status").textContent=e.message}};
</script></body></html>
